<script src=pubnub.js></script>

<!--
when data received by user
    add to draw dictionary
    append point user arary,
    sort by seqID
    slice by last 100 points

Render Loop
    clear
    paint all draw points
-->

<script>(() => {
    const maxTrackPoints = 20;
    let seqId = 0;
    const userId = `userId-${ crypto.randomUUID() }`; // Thank you Bettlee 🎉

    const userTracks = {};
    const pubnub = PubNub({});
    const channels = {
      coords   : 'coords',
      webcam   : 'webcam',
      commands : 'commands',
    };

    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');
    const body = document.querySelector('body');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Prevent mobile scroll
    body.addEventListener('touchmove', (event) => {
        event.preventDefault();
        return false;
    }, { passive: false }); 

    // Capture pointer events
    window.addEventListener('pointermove', (event) => {
        event.preventDefault();
        const x = event.clientX;
        const y = event.clientY;
        const seq = seqId++;
        const message = {
            x: x,
            y: y,
            userId: userId,
            seqId: seqId,
        };

        pubnub.publish({
            channel: channels.coord,
            message: message,
        });
        return false;
    });

    // Recieve Paint Events
    pubnub.subscribe({
        channel: channels.coord,
        messages: addUserTrack,
    });

    function addUserTrack(message) {
        console.log(message);
        const userId = message.userId;
        if (!(userId in userTracks)) userTracks[userId] = [];
        const user = userTracks[userId];
        user.push(message);

        // Truncate to 100 points only
        if (user.length > maxTrackPoints) user.shift();
    }

    function render() {
        context.clearRect(0, 0, canvas.width, canvas.height);
        Object.keys(userTracks).forEach( userId => {
            let events = userTracks[userId];
            if (events.length == 0) return true;
            if (!events[0].x) return true;
            if (!events[0].y) return true;

            context.beginPath();
            // Set default color
            context.strokeStyle = "#1FF";
            context.lineWidth = 3;

            context.moveTo(events[0].x, events[0].y);
            events.forEach( event => {
                context.lineTo(event.x, event.y);
            });
            context.stroke();
            //console.log(userId);
        } );
        // TODO Loop over all user curor Tracks
        //context.fillStyle = '#000';
        //context.fillRect(0, 0, canvas.width, canvas.height);
        requestAnimationFrame(render);
        //console.log('render' + Math.random());
    }
    requestAnimationFrame(render);
})();</script>
